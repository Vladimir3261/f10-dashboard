schema_version: 1

# ============================================================ CANDIDATE
#
# Gear SELECTOR (P/R/N/D) and drive mode from the EGS / transmission ECU
# (0x18) by static UDS 22 DA2E. A different ECU from the DDE; NOT yet
# verified on F10-520d-dev. This is the shift-lever position, not the
# engaged gear number (that is kombi/f10_gear.yaml, 0x63 D031).
#
# Source: OBDb/BMW-5-Series @ 9c5aa60 (CC-BY-SA-4.0), command 22 DA2E,
# ecu 0x18: byte 0 = 5SERIES_GEAR_SHIFT {0 Park, 1 Reverse, 2 Neutral,
# 3 Drive}; byte 1 = 5SERIES_GEAR (drive mode) {3 Drive, 5 Sport}.
# Decoded numeric here for logging; the enum meaning is in the labels.
# Validate: 0x18 answers 22 DA2E, and the bytes match the lever/mode.
# ======================================================================

mapping:
  id: candidate-f10-egs-transmission
  version: 2
  production: false
  description: >
    CANDIDATE - gear selector (P/R/N/D) + drive mode from the EGS (0x18)
    via static UDS 22 DA2E (OBDb). Unverified on this car.

source:
  type: manual
  file: OBDb/BMW-5-Series signalsets/v3/default.json
  notes: >
    OBDb/BMW-5-Series @ 9c5aa60 (CC-BY-SA-4.0). command 22 DA2E, ecu 0x18:
    byte0 GEAR_SHIFT {0=P,1=R,2=N,3=D}; byte1 drive mode {3=D,5=Sport}.

verification:
  status: verified
  method: >
    Confirmed on F10-520d-dev on a road drive 2026-08-27
    (local/sessions/drive4-gear-*): 0x18 answers 22 DA2E; byte 1 is the
    ENGAGED GEAR - it steps 1..8 with road speed (45-70 km/h -> gears
    3..8, 70+ -> 5..8), exactly a ZF 8HP. Byte 0 is constant 0 (not the
    selector, as the OBDb map claimed). The earlier parking-lot rejection
    was a false negative: a ZF 8HP won't engage high gears at standstill,
    so byte 1 only comes alive on the road.
  vehicle: F10-520d-dev (WBAFW...; VIN in local/VEHICLES.md)

ecu:
  family: transmission
  target: 0x18

defaults:
  request:
    transport: diagnostic
    protocol: uds
    service: 0x22
    target: 0x18
    timeout: 0.4

# The EGS is polled on its OWN class, not the shared `fast`.
#
# It was on `fast` (every cycle, ~10 Hz), which made the transmission the
# most aggressively polled target we have - and it is the one ECU that goes
# to sleep. A sleeping EGS answers a routing NACK or nothing at all, so at
# 10 Hz we generated up to ten failed exchanges a second, each of which used
# to tear down the whole HSFZ link (see execute.py).
#
# The rate bought nothing. Over three days that request produced 122,595
# `gear` samples carrying 8 distinct values, and 124,485 `egs_da2e_b0`
# samples carrying exactly ONE - the constant this file already documents as
# unused. A ZF 8HP shift takes ~200-400 ms, so 4 Hz still captures every
# gear the box selects.
polling_classes:
  egs: {hz: 4, priority: 2}

requests:

  egs.selector.DA2E:
    did: 0xDA2E
    polling: {class: egs}
    response: {data_length: 2}
    signals:
      # byte 0: constant 0 through P/R/N/D and while driving - reserved/
      # unused on this car, NOT the selector. Kept for the record.
      egs_da2e_b0:
        label: EGS DA2E byte0 (unused)
        unit: ""
        display: {digits: 0, min: 0, max: 8}
        decode: {type: uint8, offset: 0, round: 0}
      # byte 1: the ENGAGED GEAR. Verified on a road drive - steps 1..8
      # with speed (45-70 km/h -> 3..8, 70+ -> 5..8). At standstill it is
      # not meaningful (a ZF 8HP won't engage high gears parked), which is
      # why the parking-lot test looked noisy.
      gear:
        label: Gear
        unit: ""
        display: {digits: 0, min: 0, max: 8}
        # 0xFF (255) is the standstill/not-engaged sentinel; valid gears
        # are 1..8, so clamp it out - the dashboard shows blank when no
        # gear is engaged rather than a bogus 255.
        decode: {type: uint8, offset: 1, round: 0, valid_min: 1, valid_max: 8}

schema_version: 1

# ============================================================ CANDIDATE
#
# Per-cylinder injector balancing (FBC, "Mengenausgleichsregelung") and
# per-cylinder misfire counters from the DDE (0x12), via the proven
# F-series dynamic 0xF303 read path (d72n47a0_dynamic.yaml). NOT yet
# read on F10-520d-dev - every row here is a table claim (Tier B,
# sgbd_derived) until a supervised validation run says otherwise.
#
# Issue #15, domain 1. Diagnostic hypothesis (docs/TELEMETRY_CANDIDATES.md):
# the DDE learns a correction quantity per cylinder so that all four
# contribute equal torque at idle. A cylinder whose correction drifts away
# from the others over weeks is an injector (or compression) that is
# drifting - the classic N47 injector-ageing signature - and this is
# visible long before a rough idle or a DTC. The interesting quantity is
# the SPREAD between cylinders and its trend, not any one value.
#
# Rows quoted from the pinned d72n47a0 SG_FUNKTIONEN table
# (emdzej/ediabasx-docs-sgbd @ b644de8fbfbb4b207f57794e3c7894dc1dc58627,
# docs/sgbd/d72n47a0.md, sha256 161ec6ea...6a544b), re-fetched and
# hash-checked 2026-09-06 because the research source cache is not on
# this host. Every row: SG_ADR 12, SERVICE 22;2C, DATENTYP unsigned int
# (u16 BE). Individually cited rows only - the table is a lookup oracle,
# never bulk-copied.
#
#   FBC_qDvtCylPhys_0..3  0x5591..0x5594  mg/hub  x0.003052 -100
#       "I-Anteil der aktuellen zylinderindividuellen Korrekturmenge fuer
#        Zylinder n (in geometrischer Reihenfolge)" - GEOMETRIC order, so
#        _0 is cylinder 1 at the front = a physical injector.
#   IMKZ1..4              0x5570..0x5573  same scale, FIRING order
#       (N47 fires 1-3-4-2). Not requested here: on a 4-cylinder the two
#       sets are a permutation of each other, which is the self-
#       consistency check the validation plan uses (read them once with
#       `validate_candidate.py run ... n47.d72.dyn.5570`-style ad-hoc
#       requests if wanted; see the doc). IMKZ5/6 (0x5574/5) exist in the
#       table for 6-cylinder variants and are meaningless on an N47.
#   SMEIO                 0x45D5          mg/hub  x0.003052 -100
#       "Einspritzmenge - Sollwert ohne Mengenausgleichsregelung" - the
#       commanded quantity BEFORE balancing; the corrections are relative
#       to this, so the same 0.3 mg/hub means something different at 5
#       and at 40 mg/hub.
#   MisfDet_ctMifDrivCyc_0..3  0x442A..0x442D  count  x1
#       "Zaehler fuer die Aussetzer im aktuellen Fahrzyklus, ... pro
#        Zylinder n" - misfire counter per cylinder for the current
#        drive cycle (resets with the cycle; treat as a per-run counter).
#
# CROSS-VARIANT NOTE (recorded, not merged). The d73n47a0 records in
# research/normalized/n47/signals.jsonl (a gitignored build output of
# research.build; morguux-d73n47a0, Tier B) carry
# FBC_qDvtCylPhys_0 as x0.156863 -20 (a byte-wide -20..+20 mg/hub
# scale), while the d72 table says x0.003052 -100 over 16 bits. Every
# other row in this file agrees between the two variants to the last
# digit. Variants never merge, so the d72 row is what this d72 file
# declares - but the disagreement is exactly the kind of thing the drive
# must be alert for: if the sensed corrections cluster at +/-20 or come
# back as one byte, the define length and scale are wrong for THIS
# software and the row is rejected, not "fixed" by eye.
#
# What the table does NOT say (unknown, not assumed): whether FBC runs
# only at idle (typical for a Bosch EDC17 FBC: it balances at idle and
# holds the learned value otherwise), whether the counters' index is
# geometric or firing order, and any sentinel value. No `invalid:` is
# declared because none is sourced; a stuck 0xFFFF would decode to
# +100.0 mg/hub and be caught by `valid_max` as `clipped`.
#
# !! ONE REQUEST AT A TIME - all share dynamic DID 0xF303 !!
# ======================================================================

mapping:
  id: candidate-n47-d72-injectors
  version: 1
  production: false
  description: >
    CANDIDATE - per-cylinder FBC injector corrections (geometric order),
    the pre-balancing quantity setpoint, and per-cylinder misfire
    counters from the d72n47a0 SG_FUNKTIONEN table via 0xF303. Not yet
    read on F10-520d-dev.

source:
  type: ediabas
  file: d72n47a0 SG_FUNKTIONEN (ediabasx-docs-sgbd export)
  notes: >
    emdzej/ediabasx-docs-sgbd @ b644de8fbfbb4b207f57794e3c7894dc1dc58627,
    docs/sgbd/d72n47a0.md. Rows: FBC_qDvtCylPhys_0..3 0x5591..0x5594
    (mg/hub, 0.003052/-100), SMEIO 0x45D5 (mg/hub, 0.003052/-100),
    MisfDet_ctMifDrivCyc_0..3 0x442A..0x442D (count, 1.0). All unsigned
    int, SG_ADR 12, SERVICE 22;2C. Tier B (sgbd_derived).

verification:
  status: candidate
  method: >
    Not yet attempted on the car. Plan (docs/TELEMETRY_CANDIDATES.md,
    "Injector corrections"): warm idle, `tools/validate_candidate.py run
    <this file> --all`; pass = all four corrections within +/-2 mg/hub of
    zero and their sum near zero (FBC is a zero-sum balance), the
    setpoint a few mg/hub at idle, misfire counters 0 or a small stable
    number; fail = any cylinder decoding outside +/-10 mg/hub or the
    four values identical to the last bit (a constant, not a control
    quantity).
  vehicle: F10-520d-dev (VIN in local/VEHICLES.md)

ecu:
  family: engine
  target: discovered_engine
  sgbd: d72n47a0                # the table the rows came from - provenance
  match:
    capability:
      # Compatibility, proven by a nominated read answering in shape; not
      # a claim about the exact SGBD revision (see d72n47a0_dynamic.yaml).
      diagnostic_profile: fseries-f303-d72-compatible
    # Nominated from this file's OWN ids, so a validation run that loads
    # only this file proves the profile with a read the file needs, not
    # with a coolant read borrowed from another. Loaded beside the
    # verified set, the profile is ONE nomination and the first probe
    # that answers proves it for every file (#10); an individual id this
    # DDE then refuses shows in /api/diagnostics as a request with `sent`
    # and no `ok` (NRC recorded), not as a dropped file.
    probe: [n47.d72.dyn.5591, n47.d72.dyn.45D5]

defaults:
  request:
    transport: diagnostic
    protocol: uds
    service: 0x22
    did: 0xF303
    target: discovered_engine

# A separate SLOW staggered rotation, not `dde_dyn`.
#
# Physics: FBC corrections are learned adaptation values. They move over
# minutes of idling and drift over weeks; a 0.5 s sample of them is 100x
# more than the quantity can change. Putting nine more members on
# `dde_dyn` would slow every existing member of that rotation (23 -> 32
# requests, 21 -> 30 slots, ~10.5 s -> ~15 s per slot) for nothing.
# `dde_slow` fires one member every 10 s round-robin, so each of these
# nine refreshes every ~90 s - still several samples per idle phase,
# which is where the value lives. Cost to the fast OBD loop: one 3-frame
# F303 exchange per 10 s.
#
# config/modes.yaml does not name this class, so every mode scales it by
# 1.0 (and `sampling` mode does NOT exempt it - a validation-only load,
# so that is acceptable; revisit before any promotion).
polling_classes:
  dde_slow: {seconds: 10, priority: 6, stagger: true}

requests:

  n47.d72.dyn.5591:
    setup: ["2C 03 F3 03", "2C 01 F3 03 55 91 01 02"]
    polling: {class: dde_slow}
    response: {data_length: 2}
    signals:
      n47d_inj_corr_cyl1:
        label: Injector correction cyl 1 (FBC)
        unit: mg/hub
        display: {digits: 2, min: -5, max: 5}
        decode: {type: uint16_be, scale: 0.003052, add: -100.0, round: 3, valid_min: -20, valid_max: 20}

  n47.d72.dyn.5592:
    setup: ["2C 03 F3 03", "2C 01 F3 03 55 92 01 02"]
    polling: {class: dde_slow}
    response: {data_length: 2}
    signals:
      n47d_inj_corr_cyl2:
        label: Injector correction cyl 2 (FBC)
        unit: mg/hub
        display: {digits: 2, min: -5, max: 5}
        decode: {type: uint16_be, scale: 0.003052, add: -100.0, round: 3, valid_min: -20, valid_max: 20}

  n47.d72.dyn.5593:
    setup: ["2C 03 F3 03", "2C 01 F3 03 55 93 01 02"]
    polling: {class: dde_slow}
    response: {data_length: 2}
    signals:
      n47d_inj_corr_cyl3:
        label: Injector correction cyl 3 (FBC)
        unit: mg/hub
        display: {digits: 2, min: -5, max: 5}
        decode: {type: uint16_be, scale: 0.003052, add: -100.0, round: 3, valid_min: -20, valid_max: 20}

  n47.d72.dyn.5594:
    setup: ["2C 03 F3 03", "2C 01 F3 03 55 94 01 02"]
    polling: {class: dde_slow}
    response: {data_length: 2}
    signals:
      n47d_inj_corr_cyl4:
        label: Injector correction cyl 4 (FBC)
        unit: mg/hub
        display: {digits: 2, min: -5, max: 5}
        decode: {type: uint16_be, scale: 0.003052, add: -100.0, round: 3, valid_min: -20, valid_max: 20}

  # The quantity the corrections are relative to. Same scale as the
  # corrections, so a correction can be expressed as a fraction of it in
  # the analysis layer (a derived channel would need it in the same
  # cycle, which a 4-member set cannot get from a pair; leave that to
  # analysis, where +/-90 s alignment is fine for an adaptation value).
  n47.d72.dyn.45D5:
    setup: ["2C 03 F3 03", "2C 01 F3 03 45 D5 01 02"]
    polling: {class: dde_slow}
    response: {data_length: 2}
    signals:
      n47d_inj_qty_set:
        label: Injection quantity setpoint (pre-FBC)
        unit: mg/hub
        display: {digits: 1, min: 0, max: 80}
        decode: {type: uint16_be, scale: 0.003052, add: -100.0, round: 3}

  # Misfire counters, current drive cycle. Order (geometric vs firing)
  # is NOT stated by the table - labelled by index, not by cylinder,
  # until a run with a known single-cylinder event says which.
  n47.d72.dyn.442A:
    setup: ["2C 03 F3 03", "2C 01 F3 03 44 2A 01 02"]
    polling: {class: dde_slow}
    response: {data_length: 2}
    signals:
      n47d_misfire_ct_0:
        label: Misfire count, index 0 (drive cycle)
        unit: ""
        display: {digits: 0, min: 0, max: 1000}
        decode: {type: uint16_be, round: 0}

  n47.d72.dyn.442B:
    setup: ["2C 03 F3 03", "2C 01 F3 03 44 2B 01 02"]
    polling: {class: dde_slow}
    response: {data_length: 2}
    signals:
      n47d_misfire_ct_1:
        label: Misfire count, index 1 (drive cycle)
        unit: ""
        display: {digits: 0, min: 0, max: 1000}
        decode: {type: uint16_be, round: 0}

  n47.d72.dyn.442C:
    setup: ["2C 03 F3 03", "2C 01 F3 03 44 2C 01 02"]
    polling: {class: dde_slow}
    response: {data_length: 2}
    signals:
      n47d_misfire_ct_2:
        label: Misfire count, index 2 (drive cycle)
        unit: ""
        display: {digits: 0, min: 0, max: 1000}
        decode: {type: uint16_be, round: 0}

  n47.d72.dyn.442D:
    setup: ["2C 03 F3 03", "2C 01 F3 03 44 2D 01 02"]
    polling: {class: dde_slow}
    response: {data_length: 2}
    signals:
      n47d_misfire_ct_3:
        label: Misfire count, index 3 (drive cycle)
        unit: ""
        display: {digits: 0, min: 0, max: 1000}
        decode: {type: uint16_be, round: 0}

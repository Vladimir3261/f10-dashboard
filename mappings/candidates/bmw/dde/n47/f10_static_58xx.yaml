schema_version: 1

# ============================================================ CANDIDATE
#
# NOT verified on the target F10 520d. production: false. Source
# vehicle: an F10 535i - RIGHT chassis, WRONG engine (N55 petrol).
#
# This file encodes the one 58xx decode the source proved on-car:
#
#   TX 22 58 6F
#   RX 62 58 6F VV VV     -> u16 big-endian, absolute millibar
#
# The refreshed source pin adds the datum that the old record lacked:
# 0x586F is ABSOLUTE pressure. Key-on/engine-off it reads 1057-1058 mbar
# against roughly 1000 mbar barometric pressure, and it falls back to
# atmospheric as the engine stops. It must not be displayed or analysed
# as gauge pressure without subtracting a contemporaneous barometric
# reading. A fixed sea-level subtraction would merely replace one hidden
# assumption with another, so this mapping keeps the measured absolute
# value and names it honestly.
#
# The original drive had 159 samples, 144 distinct values and a
# 2324-4776 mbar range, monotone by RPM band (cheeseprince/
# obd-gauge-cluster @ 742f8a44, docs/BMW-STATUS.md). The same document
# records that its first byte-0-only decode was wrong by about 4x - "a
# shape check cannot validate a scale". The absolute/gauge correction
# adds the matching lesson that a scale does not establish its datum.
#
# That refreshed source also found a wider N55 static namespace
# (42xx/43xx/44xx/45xx/4Axx/58xx) and confirmed oil temperature at
# 0x4402. Those facts are recorded in
# research/evidence/n47/f10_field/oil_pressure_586F.yaml, but are not
# silently asserted here as N47 facts: every static DID still needs a
# supervised read on the target diesel DDE.
# ======================================================================

mapping:
  id: candidate-f10-static-58xx
  version: 3
  production: false
  description: >
    CANDIDATE - F10 static Mode-22 absolute oil pressure (0x586F, u16
    millibar), on-car verified on an F10 N55 petrol; unverified for the
    N47 diesel target. Gauge pressure requires contemporaneous barometric
    subtraction outside this raw measurement.

source:
  type: trace
  file: "https://github.com/cheeseprince/obd-gauge-cluster/blob/742f8a44e6c9a78f4dd43ac1bb6a9c2376c74caa/docs/BMW-STATUS.md"
  notes: >
    On-car F10 scan, pinned commit
    742f8a44e6c9a78f4dd43ac1bb6a9c2376c74caa. Transcription:
    research/evidence/n47/f10_field/oil_pressure_586F.yaml. OBDb's
    BMW-5-Series signalset disagrees on the width (8-bit scalar); the
    on-car u16 decode is used and the conflict is recorded in
    research/reports/n47-conflicts.md.

verification:
  status: candidate
  method: >
    Externally verified on the source F10 535i (N55), including
    engine-off evidence proving an absolute pressure datum. NOT verified
    on F10-520d-dev; engine family differs.
  vehicle: F10-535i-N55 (source), F10-520d-dev (target, PENDING)

ecu:
  family: engine
  target: discovered_engine
  match:
    capability:
      # Compatibility with the static 58xx DID namespace, proven by the
      # one nominated read answering two bytes. Says nothing about the
      # SGBD - and this file's source is an N55 petrol DME, so on the
      # target diesel DDE even a shape-correct answer is not a scale.
      diagnostic_profile: f10-dme-58xx-namespace
    probe: [f10.static.586F]

defaults:
  request:
    transport: diagnostic
    protocol: uds
    service: 0x22
    target: discovered_engine

requests:

  f10.static.586F:
    did: 0x586F
    polling: {class: slow}
    response: {data_length: 2}
    signals:
      f10_oil_press_absolute:
        label: Oil pressure (absolute)
        unit: mbar
        display: {digits: 0, min: 0, max: 10000}
        decode: {type: uint16_be}

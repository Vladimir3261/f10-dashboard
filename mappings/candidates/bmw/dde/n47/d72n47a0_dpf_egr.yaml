schema_version: 1

# ================================================ VERIFIED ON F10-520d-dev
#
# VERIFIED on F10-520d-dev (40-min drive, 2026-08-26 - see verification
# below). production: false - live.py loads it only via --extra-mappings.
# Same F-series dynamic 0xF303 read path as the other verified d72 files;
# all 7 DPF/emissions channels moved correctly under load on the drive.
#
# Highest-diagnostic-value N47 channels (roadmap Stage 2): DPF
# differential pressure, exhaust temps before DPF and catalyst, distance
# since last regen, successful-regen count, operating-mode status, and
# EGR control deviation. Each ties to a known N47 wear/failure mode and
# is a baseline worth trending.
#
# Every id + scale is quoted verbatim from the cached d72n47a0
# SG_FUNKTIONEN table:
#   emdzej/ediabasx-docs-sgbd @ b644de8f, docs/sgbd/d72n47a0.md
# Every row: SG_ADR 12, SERVICE 22;2C. Widths per DATENTYP (u16=02,
# u32/unsigned long=04) - reflected in both the define frame and
# data_length.
#
# CHANGES
#
#   v4 (2026-09-10)  Issue #49 (odometer API): the 0x44BF read moves out
#                    of the `dde_dyn` round-robin into its own `odometer`
#                    class at 1 Hz, and gains a second signal decoding
#                    the same four bytes as integer metres
#                    (`n47d_odometer_m`). No frame, scale or other
#                    channel changed; the km channel is untouched. Cost
#                    measured in docs/POLLING_AND_SAFETY.md.
#   v3 and earlier   see git history.
# ======================================================================

mapping:
  id: candidate-n47-d72-dpf-egr
  version: 4
  production: false
  description: >
    F-series N47 DPF/emissions dynamic (0xF303) measurements from the
    d72n47a0 SG_FUNKTIONEN table: DPF differential pressure, exhaust
    temps, regeneration distance/count/mode, EGR deviation. Verified on
    F10-520d-dev on a drive (exhaust temps + dP rise under load).

source:
  type: ediabas
  file: d72n47a0 SG_FUNKTIONEN (ediabasx-docs-sgbd export)
  notes: >
    emdzej/ediabasx-docs-sgbd @ b644de8fbfbb4b207f57794e3c7894dc1dc58627,
    docs/sgbd/d72n47a0.md. Rows: IPDIP 0x44F8, ITAVP1 0x44EF, ITAVO
    0x44F2, IDSLRE 0x44BF (u32, m), PFltRgn_ctRgnSucEEP_mp 0x44B8,
    CoEOM_stOpModeAct 0x467E (u32), AirCtl_rGovDvtNrm 0x487A.

verification:
  status: verified
  method: >
    Confirmed on F10-520d-dev on a 40-min drive 2026-08-26
    (drive-sessions/ report from local/sessions/drive2-20260826T151304Z).
    All 7 channels moved exactly as physics demands under load:
      - DPF differential pressure (0x44F8): ~0 hPa warm idle -> 35 hPa
        under exhaust flow (healthy, and validates the 0.045777/-1000 scale);
      - exhaust temp before DPF (0x44EF) 24 -> 244 degC, before catalyst
        (0x44F2) 26 -> 305 degC - both climb under load and pre-cat runs
        hotter than pre-DPF, exactly right;
      - distance since regen (0x44BF) 29.1 -> 37.1 km, monotonic over the
        ~8 km driven;
      - successful-regen count (0x44B8) steady at 92 (a real lifetime
        accumulator; no regen occurred);
      - operating-mode word (0x467E) single value, regen-inactive as
        expected;
      - EGR control deviation (0x487A) sits at 0.0 % (p50=p90=0) with two
        brief transient spikes to 51 % during load tip-in - a healthy loop.
  vehicle: F10-520d-dev (WBAFW...; VIN in local/VEHICLES.md)

ecu:
  family: engine
  target: discovered_engine
  sgbd: d72n47a0                # the table the rows came from - provenance
  match:
    capability:
      # Compatibility, proven by a nominated read answering in shape; not
      # a claim about the exact SGBD revision (see d72n47a0_dynamic.yaml).
      diagnostic_profile: fseries-f303-d72-compatible
    probe: [n47.d72.dyn.44B8, n47.d72.dyn.467E]

defaults:
  request:
    transport: diagnostic
    protocol: uds
    service: 0x22
    did: 0xF303
    target: discovered_engine

polling_classes:
  dde_dyn: {seconds: 0.5, priority: 5, stagger: true}
  # The odometer read (0x44BF) on its own, every second, for the
  # navigation client behind /api/odometer (issue #49). A member of the
  # round-robin was sampled every ~11 s; dead reckoning needs a fix
  # every second. Not staggered: one request, due every period. Priority
  # between `control_ctx` and `egs` so it goes out early in a cycle.
  # Each poll costs three exchanges (the F303 re-define + the read),
  # because the round-robin re-arms the same DID in between - measured
  # in docs/POLLING_AND_SAFETY.md.
  odometer: {seconds: 1.0, priority: 3}

requests:

  # -- DPF differential pressure (IPDIP 0x44F8) ------------------------
  #
  # Normally THE restriction signal, and the intended basis of the whole
  # condition-normalized baseline work. NOT on this car: F10-520d-dev's
  # particulate filter was REMOVED (established 2026-08-30). There is no
  # filter to restrict, so this reads the pressure drop across an empty
  # pipe and carries no health information.
  #
  # Kept and still polled: it is a real sensor reading, cheap (it shares
  # the dde_dyn round-robin), and worth having on record. But do not
  # build a baseline on it, and do not use it to corroborate the soot
  # channels - see docs/DPF_SOOT.md for why that test is void.
  n47.d72.dyn.44F8:
    setup: ["2C 03 F3 03", "2C 01 F3 03 44 F8 01 02"]
    polling: {class: dde_dyn}
    response: {data_length: 2}
    signals:
      n47d_dpf_dp:
        label: DPF differential pressure
        unit: hPa
        display: {digits: 1, min: -50, max: 800}
        decode: {type: uint16_be, scale: 0.045777, add: -1000.0, round: 2}

  # -- exhaust temp before particulate filter (ITAVP1 0x44EF) ----------
  n47.d72.dyn.44EF:
    setup: ["2C 03 F3 03", "2C 01 F3 03 44 EF 01 02"]
    polling: {class: dde_dyn}
    response: {data_length: 2}
    signals:
      n47d_exh_temp_pre_dpf:
        label: Exhaust temp before DPF
        unit: °C
        display: {digits: 0, min: -40, max: 900}
        decode: {type: uint16_be, scale: 0.031281, add: -50.0, round: 1}

  # -- exhaust temp before catalyst (ITAVO 0x44F2) ---------------------
  n47.d72.dyn.44F2:
    setup: ["2C 03 F3 03", "2C 01 F3 03 44 F2 01 02"]
    polling: {class: dde_dyn}
    response: {data_length: 2}
    signals:
      n47d_exh_temp_pre_cat:
        label: Exhaust temp before catalyst
        unit: °C
        display: {digits: 0, min: -40, max: 900}
        decode: {type: uint16_be, scale: 0.031281, add: -50.0, round: 1}

  # -- distance since last successful regen (IDSLRE 0x44BF, u32 metres) -
  #    raw is metres (MUL 1); divided to km for display (unit conversion,
  #    the underlying 1 m/bit scale is preserved).
  #
  #    Polled in its own 1 Hz `odometer` class since v4: it is the
  #    distance source of the odometer API (docs/ODOMETER_API.md). The
  #    same four bytes decode twice - as km (rounded to 10 m, the
  #    display channel that has always existed) and as whole metres
  #    (`n47d_odometer_m`, what the API accumulates; the km channel's
  #    rounding would lose the metre). Monotonic between regenerations,
  #    reset to 0 by a successful one - the accumulator in live.py
  #    bridges the reset. How closely it tracks true ground distance is
  #    UNKNOWN until it has been logged next to GPS.
  n47.d72.dyn.44BF:
    setup: ["2C 03 F3 03", "2C 01 F3 03 44 BF 01 04"]
    polling: {class: odometer}
    response: {data_length: 4}
    signals:
      n47d_dist_since_regen:
        label: Distance since regen
        unit: km
        display: {digits: 1, min: 0, max: 2000}
        decode: {type: uint32_be, divide: 1000.0, round: 2}
      #    `valid_max` on the metre channel, and only on it: it is what
      #    the odometer API accumulates, and that total is contractually
      #    monotonic - it can never be corrected downwards, so ONE
      #    absurd reading would poison the value for the life of the
      #    process. 2,000,000 m = 2,000 km is the channel's own display
      #    ceiling, and it is chosen from what the signal means: this is
      #    distance since the last SUCCESSFUL regeneration, and on this
      #    car (no particulate filter, but the ECU still commands regens
      #    against its model) the interval between them is a few hundred
      #    km. 2,000 km leaves the largest plausible interval several
      #    times over while still rejecting the two things worth
      #    rejecting - a u32 all-ones (4,294,967,295 m ~ 4.29 million
      #    km, three orders of magnitude out) and four bytes of some
      #    other dynamic read that a mis-correlated F303 response
      #    delivered here (the executor cannot tell two F303 reads apart
      #    by identifier). No `invalid:` is declared: no sentinel value
      #    for this signal is known from any source, and inventing one
      #    would be inventing BMW data - an all-ones read is caught by
      #    `valid_max` as `clipped`, which is the honest label for "the
      #    number is outside the range this channel can mean".
      #    No `valid_min` either: a `uint32_be` with no offset or scale
      #    cannot decode below zero, so a bound there could never fire.
      #    live.py refuses a negative raw anyway, and mirrors this
      #    ceiling as `ODOMETER_MAX_M` so the accumulator's guarantee
      #    does not rest on a mapping file the runtime may be started
      #    without.
      #    The km channel above is deliberately left alone: it is
      #    `sgbd_derived` and verified, its decode and its quality label
      #    are a frozen contract, and it feeds a display, not an
      #    accumulator.
      n47d_odometer_m:
        label: Distance since regen (metres)
        unit: m
        display: {digits: 0, min: 0, max: 2000000}
        decode: {type: uint32_be, round: 0, valid_max: 2000000}

  # -- successful-regeneration count (PFltRgn_ctRgnSucEEP_mp 0x44B8) ----
  n47.d72.dyn.44B8:
    setup: ["2C 03 F3 03", "2C 01 F3 03 44 B8 01 02"]
    polling: {class: dde_dyn}
    response: {data_length: 2}
    signals:
      n47d_regen_count:
        label: Successful regen count
        unit: ""
        display: {digits: 0, min: 0, max: 5000}
        decode: {type: uint16_be, round: 0}

  # -- operating-mode status bitfield (CoEOM_stOpModeAct 0x467E, u32) ---
  #    hex status; bit 0x02 is the regeneration-active flag (per the Deep
  #    OBD ccpage code). Exposed raw; bit decoding is a later step.
  n47.d72.dyn.467E:
    setup: ["2C 03 F3 03", "2C 01 F3 03 46 7E 01 04"]
    polling: {class: dde_dyn}
    response: {data_length: 4}
    signals:
      n47d_opmode:
        label: Operating mode (status word)
        unit: ""
        display: {digits: 0, min: 0, max: 65535}
        decode: {type: uint32_be, round: 0}

  # -- EGR control deviation (AirCtl_rGovDvtNrm 0x487A) ----------------
  n47.d72.dyn.487A:
    setup: ["2C 03 F3 03", "2C 01 F3 03 48 7A 01 02"]
    polling: {class: dde_dyn}
    response: {data_length: 2}
    signals:
      n47d_egr_deviation:
        label: EGR control deviation
        unit: "%"
        display: {digits: 1, min: -50, max: 50}
        decode: {type: uint16_be, scale: 0.012207, round: 2}

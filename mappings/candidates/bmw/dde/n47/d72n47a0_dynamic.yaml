schema_version: 1

# ================================================ VERIFIED ON F10-520d-dev
#
# On-car confirmed 2026-08-25 (see verification: below and
# validation-runs/). Still production: false - live.py does not load it
# yet: wiring these into the runtime needs a variant-aware capability
# provider (the `sgbd_variant` match below), which is a separate
# integration step. The CLI, the tests and the validation runner use it.
#
# ECU variant: d72n47a0 - "SGBD fuer N47TUe/N57TUe (DDE7.21/7.01/7.41)
# verwendet in F0x, F1x, F2x, F3x (UDS, MV, FlexRay)" per the SGBD's own
# comment. Wire-verified on a BMW F25 X3 N47 (klartext pcap) AND now on
# the F10 520d dev car: the 0xF303 sequence is accepted and every value
# cross-checks (dynamic coolant/boost/ambient MATCH standard OBD PIDs).
#
# !! ONE REQUEST AT A TIME !!
# All four requests below read the same dynamic DID 0xF303, and the
# evidence covers one define at a time only (each observed read
# re-armed the define). The runtime arms `setup:` once per session, so
# enabling more than one of these simultaneously would decode one
# measurement's bytes as another's. On-car validation must enable them
# one by one. Multi-source defines on F303 are an open question - see
# research/reports/n47-unresolved-questions.md.
# ======================================================================

mapping:
  id: candidate-n47-d72-dynamic
  version: 2
  production: false
  description: >
    F-series N47 dynamic (0xF303) measurements from the d72n47a0
    SG_FUNKTIONEN table. Verified on F10-520d-dev (and the source F25).
    One request may be active at a time (shared dynamic DID 0xF303).

source:
  type: trace
  file: klartext car-session-1 pcap (F25 X3) + d72n47a0 SG_FUNKTIONEN
  notes: >
    HadiCherkaoui/klartext @ 04c9ee520c3c33cbc933377ae57321c82e191319,
    docs/car-session-1-results.md (wire exchange, finding 1) and
    crates/best/tests/differential.rs:41 (ITOEL scale). Rows
    cross-checked against emdzej/ediabasx-docs-sgbd @ b644de8f
    docs/sgbd/d72n47a0.md (same primary source). Full provenance:
    research/evidence/n47/klartext_f25/.

verification:
  status: verified
  method: >
    Confirmed on F10-520d-dev at warm idle 2026-08-25
    (validation-runs/20260825T1922*, 20260825T192640Z-crosscheck). The
    0xF303 clear/define/read sequence was accepted (not 7F 22 31), and
    every channel decoded to a physically correct value with independent
    cross-checks:
      - engine temp (4BC3) 74-75 degC ~ oil temp (4517) 75 degC ~
        coolant (461B, sibling file) 80.9 degC, all warm-idle consistent;
      - dynamic coolant 461B 82.4 degC MATCHES standard OBD PID 0x05
        (82 degC) at the same moment;
      - DPF soot measured (44BE) 0.09 g ~ modelled (44C1) 0.10 g, the two
        independent estimates agree (clean/regenerated filter).
    ITMOT (4BC3) was disassembly-derived at authoring; it is now
    on-car confirmed.
  vehicle: F10-520d-dev (WBAFW...; VIN in local/VEHICLES.md)
  source_vehicle: F25-X3-N47 (original pcap evidence)

ecu:
  family: engine
  target: discovered_engine
  match:
    capability:
      # A deliberately unknown capability kind: the OBD capability
      # provider refuses kinds it does not understand, so even with
      # production: true this file would resolve to zero requests until
      # a variant-aware capability provider exists and confirms the
      # DDE variant on the car. Address is never evidence.
      sgbd_variant: d72n47a0

defaults:
  request:
    transport: diagnostic
    protocol: uds
    service: 0x22
    target: discovered_engine

# Proprietary F303 reads are STAGGERED. Each is a 3-frame exchange
# (clear + define + read), so firing all of them on one cycle stalls the
# fast OBD channels for ~1s. `stagger: true` fires ONE member per
# due-cycle, round-robin, bounding the per-cycle cost to a single read.
# every=5 at 10 Hz => one proprietary read per ~0.5s; with N channels
# each refreshes every ~N*0.5s, and the fast loop pauses only ~90ms at a
# time instead of ~1.2s in a block.
polling_classes:
  dde_dyn: {every: 5, priority: 2, stagger: true}

requests:

  # -- oil temperature - the pcap-verified exchange -------------------
  #
  #   TX 2C 03 F3 03                  (clear dynamic define)
  #   TX 2C 01 F3 03 45 17 01 02      (define F303 := source 0x4517, u16)
  #   TX 22 F3 03
  #   RX 62 F3 03 39 08               -> 14600 * 0.01 - 100 = 46.0 degC
  #
  n47.d72.dyn.4517:
    did: 0xF303
    setup:
      - "2C 03 F3 03"
      - "2C 01 F3 03 45 17 01 02"
    polling: {class: dde_dyn}
    response: {data_length: 2}
    signals:
      n47d_oil_temp:
        label: Oil temperature (DDE)
        unit: °C
        display: {digits: 1, min: -40, max: 160}
        decode: {type: uint16_be, scale: 0.01, add: -100.0, round: 2}

  # -- DPF soot, measured (IMRUP 0x44BE) -----------------------------
  # 15.49 g was the SOURCE vehicle (F25); on F10-520d-dev this read
  # 0.09 g at validation. See the falsification note on the signal.
  n47.d72.dyn.44BE:
    did: 0xF303
    setup:
      - "2C 03 F3 03"
      - "2C 01 F3 03 44 BE 01 02"
    polling: {class: dde_dyn}
    response: {data_length: 2}
    signals:
      n47d_soot_meas:
        label: DPF soot (measured)
        unit: g
        display: {digits: 2, min: 0, max: 80}
        decode: {type: uint16_be, scale: 0.015259, round: 2}
        #
        # FALSIFIED as "current soot load in the filter" - 2026-08-29.
        #
        # A completed regeneration burns soot out, so a current-load channel
        # must drop across one. This did not. Over 1404 points spanning
        # 2026-08-26..29 the value NEVER decreased (0 decreases, 0.12 ->
        # 9.35 g), including across a regeneration confirmed by two
        # independent counters: n47d_regen_count 92 -> 93 and
        # n47d_dist_since_regen resetting to 0.
        #
        # Within one regen cycle it tracks distance almost exactly -
        # ~0.032 g/km, consistent to about 2% over 164 km, intercept ~0.
        # A physical soot load would depend on load, temperature and exhaust
        # flow, not on distance alone.
        #
        # The scale may well be right: the values are plausible grams and
        # were cross-checked at idle. It is the MEANING that is wrong.
        # Cumulative-since-adaptation-reset, an ash estimate, or a
        # distance-driven model are all still open. The single warm-idle
        # reading that earned this `verified` could not have distinguished
        # them; only straddling a regeneration could, and it failed.
        #
        # Do not build DPF health conclusions on this channel until a second
        # regeneration is observed or the SGBD definition is found.
        #
        verification:
          status: candidate
          method: >
            Decodes to a plausible value, but its first real test failed: it
            did not drop across a confirmed regeneration, and never decreases
            at all. Meaning unresolved - see docs/DPF_SOOT.md.

  # -- DPF soot, simulated (IMPAS 0x44C1) ----------------------------
  # 15.5 g was the SOURCE vehicle (F25); on F10-520d-dev this read
  # 0.10 g at validation.
  n47.d72.dyn.44C1:
    did: 0xF303
    setup:
      - "2C 03 F3 03"
      - "2C 01 F3 03 44 C1 01 02"
    polling: {class: dde_dyn}
    response: {data_length: 2}
    signals:
      n47d_soot_model:
        label: DPF soot (modelled)
        unit: g
        display: {digits: 2, min: 0, max: 80}
        decode: {type: uint16_be, scale: 0.01, round: 2}
        #
        # Same finding as n47d_soot_meas, plus a second oddity: the two track
        # each other to within ~0.01 g despite carrying scales that differ by
        # a factor of 1.53. Either they read the same underlying quantity and
        # one scale is wrong, or the raw registers happen to differ by
        # exactly the inverse ratio. Unresolved.
        #
        verification:
          status: candidate
          method: >
            Tracks n47d_soot_meas to ~0.01 g despite a 1.53x scale
            difference, and did not drop across a confirmed regeneration.
            Meaning unresolved - see docs/DPF_SOOT.md.

  # -- engine temperature (ITMOT 0x4BC3) ------------------------------
  #
  # Disassembly-derived only (klartext marks it "pending on-car
  # confirmation"): raw is deci-Kelvin, 0x0E2F -> 89.96 degC.
  #
  n47.d72.dyn.4BC3:
    did: 0xF303
    setup:
      - "2C 03 F3 03"
      - "2C 01 F3 03 4B C3 01 02"
    polling: {class: dde_dyn}
    response: {data_length: 2}
    signals:
      n47d_engine_temp:
        label: Engine temperature (DDE)
        unit: °C
        display: {digits: 1, min: -40, max: 140}
        decode: {type: uint16_be, scale: 0.1, add: -273.14, round: 2}

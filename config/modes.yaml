schema_version: 1

# ======================================================================
# Drive modes - how hard to poll the car.
#
# A mode SCALES the polling classes the mapping files declare. It is not
# a second scheduler: there stays exactly one mechanism deciding when a
# request is due (bmwdiag/mapping/polling.py). A mapping says what a
# channel IS - rpm is fast, coolant is slow - and a mode says how much of
# that the operator wants right now.
#
#     effective_period = declared_period * multiplier
#
# A multiplier > 1 polls less often, < 1 more often. `normal` is
# all-ones by definition: it IS the rates the mappings declare.
#
# WHY THIS IS DATA, NOT CODE
#
# Everything else the runtime needs to know about polling lives in
# versioned files; the mode table was the one exception, which made
# tuning a duty window a code change. Only the TABLE is here - the
# arithmetic that applies it stays in Python. Nothing in this file
# executes: there is no expression language, and `multipliers` are plain
# numbers, exactly like the mapping format.
#
# VERSIONING - READ THIS BEFORE EDITING
#
# Every session records its mode as PLAIN TEXT ("long") plus a single
# fingerprint string listing every versioned data file that shaped the
# run - this table included, as `drive-modes@<version>`. That is what
# keeps the name honest: without a version, a run labelled `long` in
# March and one labelled `long` in June could have been taken at
# different rates and nothing would say so - which is exactly the
# invisible confound that recording the mode at all is meant to prevent.
#
# So: **increment `version` by one on every change to the numbers in this
# file.** Not for comments or descriptions - those do not alter what any
# mode does. Same rule as `mapping.version`, and for the same reason.
#
# The class names below (`motion`, `context`, ...) must match classes
# some loaded mapping actually declares. That is checked at load time -
# a typo used to silently do nothing.
#
# CHANGES
#
#   v4 (2026-09-10)  `odometer` - the 1 Hz class the DPF/EGR file (v4)
#                    puts the 0x44BF distance read in for the odometer
#                    API (issue #49, docs/ODOMETER_API.md). Named x1.0
#                    in `long` and `debug` - a navigation client needs
#                    a fix every second whatever the drive is doing,
#                    and faster than the ECU updates is worthless - and
#                    NOT exempt from `sampling`'s sleep: it is a fast
#                    class, and exempting it would keep the F303 DID
#                    re-armed every second through the quiet window.
#                    Navigation needs `normal` or `long`; the API doc
#                    says so. `off` stays silent.
#   v3 (2026-09-10)  `dde_slow` and `egs_slow` - the 10 s classes the
#                    issue #15 candidate files declare (injector
#                    corrections, IBS state, tank content; EGS ATF) -
#                    are now named in every mode that names anything,
#                    treated exactly like `slow`: exempt from
#                    `sampling`'s sleep, left alone in `long`, x0.1 in
#                    `debug`. Under v2 every mode scaled them x1.0 and
#                    `sampling` put them to sleep with the burst, so a
#                    150 s rotation lost 3 of its 15 members every
#                    window. Only a run that loads a candidate file
#                    (`./run_car.sh --candidate ...`) declares them; a
#                    bare launch is unchanged and its startup note about
#                    undeclared classes is expected.
#   v2 (2026-09-01)  `control_ctx` and `egs` named; `dde_dyn` x2 in
#                    `long`.
# ======================================================================

# Identity, exactly like a mapping file's. `drive-modes@<version>` is
# recorded in each session's mapping set alongside every mapping file, so
# one string identifies the whole sampling configuration of a drive.
id: drive-modes
version: 4

# The declared rates - what `normal` means - live in the mapping files:
#
#   motion   10 Hz    rpm, speed, map, pedal
#   control_ctx 1/1 s load, maf - the two that condition control-loop work
#   context  1/10 s   throttle, relthr, torque, rail, lambda
#   slow     1/10 s   temps, voltage, fuel rate, cat, EGR
#   rare     1/60 s   ambient, baro, fuel level, runtime, distance
#   dde_dyn  round-robin, one member per 0.5 s - 23 members with the
#                     ./run_car.sh set (~1/11.5 s each), 34 with every
#                     #15 candidate loaded (~1/17 s each); measured by
#                     tests/test_final_test_readiness.py
#   egs      2 Hz     engaged gear
#   odometer 1 Hz     distance since regen (0x44BF), the odometer API's
#                     source - one request, three exchanges per poll
#                     (docs/POLLING_AND_SAFETY.md)
#   dde_slow 1/10 s   round-robin, one member per 10 s - the #15
#                     candidates' adaptation/state reads (15 members
#                     when every file is loaded: ~150 s each)
#   egs_slow 1/10 s   the EGS's own slow read (ATF temperature raw)
#
# The last two exist only when a candidate file is loaded. They are
# slow classes in the sense that matters here - a quantity that moves
# over minutes - so every mode treats them exactly as it treats `slow`.
#
# Multipliers are annotated with the rate they produce, since a bare
# number like 0.01 says nothing on its own.

modes:

  # Offered in this order, quietest first. The order is MEASURED, not
  # assumed - see tests/test_drive_modes.py, which counts requests over a
  # full duty period. `sampling` lands below `long` because it silences
  # the fast tiers entirely for ten minutes in twelve, where `long`
  # merely slows them.

  off:
    description: connected but silent - no request is sent
    # Not the same as not running: the link stays up and the ECUs are
    # left alone, which is what makes it the right tool for isolating
    # "does the cable keep the car awake?" from "does the polling?".
    polls: false

  sampling:
    description: duty-cycled bursts for multi-hour drives
    # Two minutes of full-rate data every twelve. While awake it polls at
    # the full declared rate - that is the point of it.
    duty: {awake: 120, asleep: 600}
    # The slow classes never sleep. The events worth catching on a long
    # drive - a thermal excursion, a regeneration - are exactly the ones
    # that would start and finish inside a quiet window. `dde_slow` and
    # `egs_slow` are slow classes too: a 150 s rotation that slept for
    # 600 s in 720 would never complete inside one burst. `odometer`
    # is NOT exempt: it sleeps with the fast tiers, so this mode cannot
    # feed the navigation client (docs/ODOMETER_API.md).
    exempt: [slow, rare, dde_dyn, dde_slow, egs_slow]

  long:
    description: motorway cruising - most samples are redundant
    # On cruise control the car can hold one gear and speed for
    # kilometres, so the fast tier is nearly all duplicate rows.
    multipliers:
      motion: 5.0            # 10 Hz   -> 2 Hz
      control_ctx: 3.0       # 1/1 s   -> 1/3 s
      context: 3.0           # 1/10 s  -> 1/30 s
      egs: 4.0               # 2 Hz    -> 0.5 Hz
      dde_dyn: 2.0           # ~1/11 s -> ~1/22 s
      # Navigation needs its fix every second on a motorway as much as
      # anywhere; 1 Hz is already the useful ceiling.
      odometer: 1.0          # 1 Hz    -> 1 Hz
      # Like `slow`, which `long` does not name: a 10 s adaptation read
      # is already as slow as it is useful. Named at 1.0 so the choice
      # is visible here rather than implied by absence.
      dde_slow: 1.0          # 1/10 s  -> 1/10 s
      egs_slow: 1.0          # 1/10 s  -> 1/10 s

  normal:
    description: the rates the mappings declare
    # Deliberately empty. `normal` scales nothing BY DEFINITION, so
    # "what rate was this recorded at?" is answered by the mapping
    # version alone and there is no third source of truth.

  debug:
    description: everything, fast - for investigating a problem
    # Reproduces the pre-2026-08-30 behaviour: the whole OBD set at the
    # loop rate, the DDE reads five times faster.
    multipliers:
      control_ctx: 0.1       # 1/1 s   -> 10 Hz
      context: 0.01          # 1/10 s  -> 10 Hz
      slow: 0.1              # 1/10 s  -> 1 Hz
      rare: 0.1              # 1/60 s  -> 1/6 s
      dde_dyn: 0.2           # ~1/11 s -> ~1/2.2 s
      egs: 0.5               # 2 Hz    -> 4 Hz
      odometer: 1.0          # 1 Hz    -> 1 Hz (the ECU's own update
                             #   rate of the distance counter is not
                             #   known to be faster; three exchanges
                             #   per poll is the price of any more)
      dde_slow: 0.1          # 1/10 s  -> 1 Hz, like slow (a member per s)
      egs_slow: 0.1          # 1/10 s  -> 1 Hz

default: normal

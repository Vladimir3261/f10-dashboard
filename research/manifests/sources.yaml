# Source manifest - every external source the research pipeline may
# reference. A research record naming a source_id absent from this file
# fails validation (tests/research/test_license_manifest.py).
#
# Pins were taken 2026-08-25. license.id records what was actually
# determined at the pinned revision; "unknown" is a determination, not a
# gap. commercial_runtime_copy_allowed refers to copying IMPLEMENTATION
# into a potentially commercial runtime - extracting individual factual
# protocol observations with citation is a separate question tracked in
# research/reports/legal-and-license-notes.md.


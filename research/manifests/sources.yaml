# How evidence hangs together. Two exports of the same BMW table are the
# same primary source: their agreement validates parsers, not vehicles.
relationships:
  - a: klartext
    b: ediabasx-docs-sgbd
    type: same_primary_source
    notes: "both derive d72n47a0 facts from BMW's d72n47a0.prg"
  - a: morguux-d73n47a0
    b: ediabasx-docs-sgbd
    type: same_primary_source
    notes: "the CSV is an SG_FUNKTIONEN/MESSWERTETAB-shaped export of BMW's D73N47A0 SGBD"
  - a: morguux-d73n47a0
    b: klartext
    type: same_primary_source
    notes: "same BMW SGBD table family (different variant files of one catalogue)"
  - a: deepobd-configs
    b: ediabaslib
    type: derived_from
    notes: "ccpage configs following ediabaslib's Deep OBD samples"
  - a: dieslg8
    b: morguux-d73n47a0
    type: same_primary_source
    notes: "sibling D73 exports (N57 vs N47 variant of the same catalogue)"
  - a: wican-issue-752
    b: klartext
    type: independent
    notes: "different car, chassis generation, protocol and tooling"
  - a: wican-issue-752
    b: morguux-d73n47a0
    type: independent
    notes: "capture vs table export; no shared ancestry demonstrated, though both ultimately describe Bosch DDE data"
  - a: obd-gauge-cluster
    b: obdb-bmw-5-series
    type: independent
    notes: "on-car scan explicitly contradicts parts of the community signalset"

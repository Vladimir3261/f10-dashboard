# WireGuard client config for the Pi — copy to config/wireguard.conf
# (gitignored) and fill in REAL keys/endpoint. configure-wireguard.sh
# installs this as /etc/wireguard/wg0.conf and enables wg-quick@wg0.
#
# NEVER commit a real PrivateKey, the server PublicKey tied to the actual
# deployment, the real public endpoint, or the real subnet. Placeholders
# only in git.
#
# Example private management subnet (use your own): 10.77.0.0/24
#   server -> <WG_SERVER_IP>   (e.g. 10.77.0.1)
#   this Pi -> <WG_PI_IP>      (e.g. 10.77.0.2, fixed)

[Interface]
Address = <WG_PI_IP>/32
PrivateKey = <PI_WG_PRIVATE_KEY>
# Optional: DNS = <WG_DNS>

[Peer]
PublicKey = <WG_SERVER_PUBLIC_KEY>
Endpoint = <WIREGUARD_SERVER_PUBLIC_IP>:<WIREGUARD_SERVER_PORT>
# Route only the management subnet over the VPN — do NOT send all traffic
# through wg0 (Internet/cloud must stay on wlan0).
AllowedIPs = <WG_SUBNET>          # e.g. 10.77.0.0/24
# Keep the tunnel alive through NAT/CGNAT since the Pi initiates it.
PersistentKeepalive = 25

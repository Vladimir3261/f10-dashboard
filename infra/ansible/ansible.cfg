[defaults]
inventory = inventory/hosts.yml
host_key_checking = False
remote_user = root
retry_files_enabled = False
# Readable YAML output. The old `stdout_callback = yaml` came from
# community.general and was removed in that collection's v12; the built-in
# default callback does the same thing via result_format (ansible-core 2.13+).
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent

[ssh_connection]
pipelining = True

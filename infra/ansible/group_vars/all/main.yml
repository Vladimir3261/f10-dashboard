---
# Non-secret configuration for the analytics server.
#
# SECRETS ARE NOT HERE. CH_PASS / INGEST_TOKEN / GF_ADMIN_PASSWORD come from
# your local infra/.env (the Makefile exports it into the environment) and
# the stack role reads them with lookup('env', ...). See infra/.env.example.
#
# Host-specific values (droplet IP, ansible_user, wireguard_port, and the
# admin public keys) come from the generated inventory - see
# inventory/hosts.yml.example.

# Repo deployed on the server.
#
# Normally you do NOT set this: `make inventory` writes repo_url into the
# generated inventory from THIS checkout's `git remote origin` (rewritten to
# https), so a fork deploys its own code with nothing to edit here. That host
# var wins over this fallback.
#
# Set it only to pin a specific repo, e.g. when deploying from a checkout
# with no origin remote:
# repo_url: "https://github.com/<owner>/<repo>.git"
repo_version: "master"
app_dir: /opt/f10-dashboard

# Non-root admin login created on the server. Its authorized_keys (and
# root's) are managed from admin_ssh_public_keys, so rotating keys is just
# another `make deploy` - no droplet recreate needed.
admin_user: f10

# Keep root reachable by key so Ansible (which logs in as root) keeps
# working. Flip to true ONLY after switching the inventory to the admin
# user, or you can lock yourself out.
disable_root_login: false

# WireGuard gateway. wireguard_port comes from the inventory (terraform).
#
# PRIMARY PURPOSE: reach the Raspberry Pi by SSH when it is not on your LAN.
# The Pi lives in the car behind CGNAT/mobile data and has no public address,
# so it dials out to this server, and THIS SERVER IS THE JUMP HOST: you SSH
# to the VPS over public SSH, then from the VPS to the Pi over the tunnel.
#
#   ssh -J root@<vps> f10@10.77.0.10
#
# Only the Pi needs to be a peer. Your laptop does not - it never joins the
# VPN. (Adding it as a second peer is possible if you ever want to skip the
# VPS hop, but it is not needed for this model.)
#
# The lake ingest also runs over the same tunnel, so the bearer token and
# telemetry never cross the public internet in the clear.
wireguard_address: "10.77.0.1/24"     # the server's address on the VPN
wireguard_peers: []                   # e.g.:
#   - name: f10pi                     # the in-car Raspberry Pi
#     public_key: "<pi public key>"
#     allowed_ips: "10.77.0.10/32"

---
# Configure the analytics server: hardening + Docker + the telemetry stack
# (ClickHouse, ingest, Grafana) + the WireGuard gateway for the Pi tunnel.
#
# Run with: make deploy   (installs collections, then this playbook)
# Inventory is generated from terraform output by `make inventory`.

- name: Analytics server
  hosts: all
  gather_facts: false

  pre_tasks:
    # Read infra/.env HERE rather than relying on the Makefile's `export`.
    # Make expands `$` as a variable reference, so a secret containing `$`
    # silently loses that character and the one after it - which is exactly
    # how a correct password ends up rejected. Splitting each line on the
    # first `=` takes the value literally, whatever it contains.
    - name: Load infra/.env
      ansible.builtin.set_fact:
        dotenv: >-
          {{ dotenv | default({}) | combine({
               (item.split('=', 1)[0] | trim): item.split('=', 1)[1]
             }) }}
      loop: "{{ lookup('file', playbook_dir + '/../.env', errors='ignore')
                | default('', true) | split('\n') }}"
      when: item is match('^[A-Za-z_][A-Za-z0-9_]*=')
      no_log: true
      delegate_to: localhost
      run_once: true

    - name: Wait for SSH to come up (fresh droplets boot for a bit)
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Gather facts
      ansible.builtin.setup:

  roles:
    - base        # admin user, key management, SSH hardening, ufw
    - docker      # Docker engine + compose plugin
    - stack       # clone the repo, render .env, docker compose up
    - nginx       # host reverse proxy: public, IP-allowlisted Grafana
    - wireguard   # WireGuard gateway for the Raspberry Pi tunnel

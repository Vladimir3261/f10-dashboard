---
# Install Docker Engine + the Compose plugin from Docker's official apt repo
# (provider-agnostic; works on any Ubuntu host, not a DO-specific image).

- name: Ensure keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker apt GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

# Written directly as a deb822 .sources file rather than via
# ansible.builtin.apt_repository (deprecated, removed in ansible-core 2.25)
# or deb822_repository (needs python3-debian on the target). apt on Ubuntu
# understands this format natively, so this needs nothing extra.
- name: Add Docker apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: {{ ansible_facts['distribution_release'] }}
      Components: stable
      Architectures: {{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}
      Signed-By: /etc/apt/keyrings/docker.asc

- name: Remove any older one-line docker.list (avoids a duplicate source)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Install Docker Engine + Compose plugin
  ansible.builtin.apt:
    update_cache: true
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Allow the admin user to run Docker
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: [docker]
    append: true

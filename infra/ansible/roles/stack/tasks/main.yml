---
# Deploy the telemetry stack: clone the repo, render infra/.env from the
# secrets in the (exported) local environment, and bring the compose stack
# up (ClickHouse + ingest + Grafana).

- name: Require stack secrets in the environment
  ansible.builtin.assert:
    that:
      - dotenv.get('CH_PASS', '') | length > 0
      - dotenv.get('INGEST_TOKEN', '') | length > 0
      - dotenv.get('GF_ADMIN_PASSWORD', '') | length > 0
    fail_msg: >-
      CH_PASS, INGEST_TOKEN and GF_ADMIN_PASSWORD must be set. Fill
      infra/.env on your machine - see
      infra/.env.example.
    quiet: true

- name: Require a repo to deploy
  ansible.builtin.assert:
    that:
      - repo_url is defined
      - repo_url | length > 0
    fail_msg: >-
      repo_url is not set. It is normally written into the inventory from
      this checkout's git origin - run `make inventory`. If this checkout
      has no origin remote, set repo_url in ansible/group_vars/all.yml.
    quiet: true

- name: Clone/update the repo on the server
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ app_dir }}"
    version: "{{ repo_version }}"
    force: true

- name: Render infra/.env on the server
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/infra/.env"
    mode: "0600"

- name: Bring the compose stack up
  ansible.builtin.command:
    cmd: docker compose up -d --build --remove-orphans
    chdir: "{{ app_dir }}/infra"
  register: compose_up
  changed_when: >-
    ('Started' in compose_up.stderr) or ('Created' in compose_up.stderr)
    or ('Recreated' in compose_up.stderr) or ('Built' in compose_up.stderr)

# GF_SECURITY_ADMIN_PASSWORD only takes effect when Grafana initialises its
# database for the first time. Changing it in .env afterwards has no effect,
# so a corrected password would still be rejected at the login form. Reset it
# explicitly on every deploy to keep Grafana in step with infra/.env.
- name: Reconcile the Grafana admin password with infra/.env
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - exec
      - -T
      - grafana
      - grafana
      - cli
      - admin
      - reset-admin-password
      - "{{ dotenv.get('GF_ADMIN_PASSWORD', '') }}"
    chdir: "{{ app_dir }}/infra"
  register: gf_reset
  changed_when: "'Admin password changed successfully' in gf_reset.stdout"
  retries: 10
  delay: 6
  until: gf_reset.rc == 0
  no_log: true

# Probe wherever ingest is actually published. INGEST_BIND is normally the
# WireGuard address (so the Pi can reach it), NOT loopback - hardcoding
# 127.0.0.1 here fails the deploy even though the stack is fine.
- name: Wait for the ingest server to become healthy
  ansible.builtin.uri:
    url: "http://{{ dotenv.get('INGEST_BIND', '127.0.0.1') }}:8090/health"
    status_code: [200, 503]     # 503 = up but ClickHouse not ready yet
  register: ingest_health
  retries: 20
  delay: 6
  until: ingest_health.status == 200

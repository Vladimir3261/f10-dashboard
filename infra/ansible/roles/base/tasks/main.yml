---
# Base hardening: packages, a non-root admin user, key management for both
# admin and root (so key rotation is a re-deploy, not a droplet recreate),
# SSH hardening, and a firewall that opens only SSH + WireGuard.

- name: Wait for cloud-init to finish
  ansible.builtin.raw: cloud-init status --wait || true
  changed_when: false

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name: [ufw, curl, ca-certificates, gnupg, git, python3, rsync]
    state: present

# --- admin user ------------------------------------------------------------

- name: Create admin group
  ansible.builtin.group:
    name: "{{ admin_user }}"
    state: present

- name: Create admin user
  ansible.builtin.user:
    name: "{{ admin_user }}"
    group: "{{ admin_user }}"
    groups: [sudo]
    append: true
    shell: /bin/bash
    create_home: true

- name: Passwordless sudo for the admin user
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ admin_user }}"
    content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: "visudo -cf %s"

# --- authorized_keys (admin + root), from the inventory -------------------

- name: Ensure .ssh directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "/home/{{ admin_user }}/.ssh"
    - "/root/.ssh"

- name: Set admin ownership on its .ssh
  ansible.builtin.file:
    path: "/home/{{ admin_user }}/.ssh"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"

- name: Install admin authorized_keys
  ansible.builtin.template:
    src: authorized_keys.j2
    dest: "/home/{{ admin_user }}/.ssh/authorized_keys"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0600"
  when: admin_ssh_public_keys | default([]) | length > 0

- name: Install root authorized_keys (keeps root reachable for Ansible)
  ansible.builtin.template:
    src: authorized_keys.j2
    dest: /root/.ssh/authorized_keys
    owner: root
    group: root
    mode: "0600"
  when: admin_ssh_public_keys | default([]) | length > 0

# --- SSH hardening ---------------------------------------------------------

- name: Harden sshd (key-only; root by key unless disabled)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-f10.conf
    mode: "0644"
    content: |
      # Managed by Ansible (base role). Key-only auth.
      PasswordAuthentication no
      PubkeyAuthentication yes
      PermitRootLogin {{ 'no' if disable_root_login else 'prohibit-password' }}
  notify: restart ssh

# --- firewall (SSH + WireGuard only) --------------------------------------

- name: UFW default deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny

- name: UFW default allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: UFW allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: UFW allow WireGuard
  community.general.ufw:
    rule: allow
    port: "{{ wireguard_port | default(51820) }}"
    proto: udp

- name: Enable UFW
  community.general.ufw:
    state: enabled

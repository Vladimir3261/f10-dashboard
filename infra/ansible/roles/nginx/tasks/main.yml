---
# nginx on the HOST as the public edge.
#
# Why a host reverse proxy rather than publishing container ports: Docker
# inserts its own iptables rules ahead of ufw's INPUT chain, so a published
# container port is reachable even when ufw says otherwise. nginx is an
# ordinary host process, so ufw governs it normally - and the IP allowlist
# lives in one readable place instead of a raw iptables chain.
#
# Two optional vhosts, each enabled only when its domain is set:
#   GRAFANA_DOMAIN    -> 127.0.0.1:3000        (IP-allowlisted)
#   DASHBOARD_DOMAIN  -> <PI_WG_IP>:8080       (Basic Auth, over WireGuard)
# With no domains set, a plain-HTTP IP vhost for Grafana is used instead.

- name: Read edge configuration from the environment
  ansible.builtin.set_fact:
    # Values come from the dotenv dict loaded in site.yml, not the
    # environment: Make's export mangles any value containing `$`.
    gf_allowed_ips: >-
      {{ dotenv.get('GF_ALLOWED_IPS', '').split(',')
         | map('trim') | reject('equalto', '') | list }}
    gf_public_port: "{{ dotenv.get('GF_PUBLIC_PORT', '') | default('80', true) }}"
    gf_server_name: "{{ dotenv.get('GF_SERVER_NAME', '') | default('_', true) }}"
    grafana_domain: "{{ dotenv.get('GRAFANA_DOMAIN', '') | trim }}"
    dashboard_domain: "{{ dotenv.get('DASHBOARD_DOMAIN', '') | trim }}"
    pi_wg_ip: "{{ dotenv.get('PI_WG_IP', '') | default('10.77.0.10', true) }}"
    pi_dashboard_port: "{{ dotenv.get('PI_DASHBOARD_PORT', '') | default('8080', true) }}"
    dashboard_auth_user: "{{ dotenv.get('DASHBOARD_AUTH_USER', '') | default('f10', true) }}"
    dashboard_auth_password: "{{ dotenv.get('DASHBOARD_AUTH_PASSWORD', '') }}"
    le_email: "{{ dotenv.get('LETSENCRYPT_EMAIL', '') | trim }}"
    le_staging: "{{ dotenv.get('LETSENCRYPT_STAGING', '') | default('0', true) }}"

- name: Decide whether TLS is in play
  ansible.builtin.set_fact:
    tls_domains: "{{ [grafana_domain, dashboard_domain] | reject('equalto', '') | list }}"

- name: Install nginx (and passlib, needed by the htpasswd module)
  ansible.builtin.apt:
    name: [nginx, python3-passlib]
    state: present

- name: Remove the default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

# --- guard rails before touching Let's Encrypt -----------------------------

- name: Validate the TLS configuration
  when: tls_domains | length > 0
  block:
    - name: Require a Let's Encrypt contact address
      ansible.builtin.assert:
        that: le_email | length > 0
        fail_msg: "LETSENCRYPT_EMAIL must be set in infra/.env when a domain is configured."
        quiet: true

    - name: Require Basic Auth credentials for the dashboard
      ansible.builtin.assert:
        that:
          - dashboard_auth_password | length > 0
          - dashboard_auth_password != 'change-me-dashboard-password'
        fail_msg: >-
          DASHBOARD_AUTH_PASSWORD must be set to a real value in infra/.env.
          The dashboard has no login of its own and serves the VIN, so it is
          never published without authentication.
        quiet: true
      when: dashboard_domain | length > 0

    # A wrong A record is the usual cause of a cryptic certbot failure, and
    # repeated failures burn the Let's Encrypt rate limit. Check first.
    - name: Resolve each domain
      ansible.builtin.command: "getent hosts {{ item }}"
      register: dns_check
      changed_when: false
      failed_when: false
      loop: "{{ tls_domains }}"

    - name: Require each domain to resolve to this droplet
      ansible.builtin.assert:
        that: ansible_host in (item.stdout | default(''))
        fail_msg: >-
          {{ item.item }} does not resolve to this droplet ({{ ansible_host }}).
          Point an A record at it and wait for propagation before deploying.
          Resolved: "{{ item.stdout | default('(nothing)') | trim }}"
        quiet: true
      loop: "{{ dns_check.results }}"
      loop_control:
        label: "{{ item.item }}"

# --- certificates ----------------------------------------------------------

- name: Set up TLS with Let's Encrypt
  when: tls_domains | length > 0
  block:
    - name: Install certbot
      ansible.builtin.apt:
        name: [certbot, python3-certbot-nginx]
        state: present

    - name: Ensure the ACME webroot exists
      ansible.builtin.file:
        path: /var/www/letsencrypt/.well-known/acme-challenge
        state: directory
        recurse: true
        mode: "0755"

    # Port 80 must be reachable from ANY address for the HTTP-01 challenge -
    # Let's Encrypt validates from many global IPs. This vhost therefore
    # serves ONLY the challenge path and redirects everything else to HTTPS;
    # the real access control lives on the 443 vhosts.
    - name: Install the ACME/redirect vhost on port 80
      ansible.builtin.template:
        src: acme-redirect.conf.j2
        dest: /etc/nginx/sites-available/00-acme.conf
        mode: "0644"

    - name: Enable the ACME vhost
      ansible.builtin.file:
        src: /etc/nginx/sites-available/00-acme.conf
        dest: /etc/nginx/sites-enabled/00-acme.conf
        state: link

    - name: Open port 80 for ACME validation
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp

    # Take the domain vhosts out of the way for the ACME phase. They are
    # re-created further down, once the certificates exist. This keeps the
    # challenge phase working from any starting state: on a first run the
    # vhosts reference certificates that do not exist yet, and after a failed
    # run a stale or broken vhost would otherwise make nginx refuse to
    # reload - blocking the very step that would fix it.
    - name: Disable the domain vhosts during certificate issuance
      ansible.builtin.file:
        path: "/etc/nginx/sites-enabled/{{ item }}"
        state: absent
      loop: [grafana.conf, dashboard.conf]

    - name: Reload nginx so the challenge path is served
      ansible.builtin.service:
        name: nginx
        state: reloaded

    # Prove port 80 is reachable FROM THE INTERNET before calling certbot.
    # The check runs from the control machine, not the server, because the
    # server cannot test its own external reachability. Without this, a
    # closed cloud firewall surfaces only as certbot's opaque "Timeout
    # during connect", after a failed attempt has already been charged
    # against the Let's Encrypt rate limit.
    - name: Place a reachability probe in the ACME webroot
      ansible.builtin.copy:
        dest: /var/www/letsencrypt/.well-known/acme-challenge/f10-preflight
        content: "f10-preflight\n"
        mode: "0644"

    - name: Check each domain answers on port 80 from outside
      ansible.builtin.uri:
        url: "http://{{ item }}/.well-known/acme-challenge/f10-preflight"
        return_content: true
        follow_redirects: none
        timeout: 15
      register: acme_probe
      failed_when: false
      changed_when: false
      delegate_to: localhost
      loop: "{{ tls_domains }}"

    - name: Require port 80 to be reachable before issuing certificates
      ansible.builtin.assert:
        that: "'f10-preflight' in (item.content | default(''))"
        fail_msg: >-
          {{ item.item }} is not reachable on port 80 from the internet, so
          the Let's Encrypt HTTP-01 challenge cannot succeed.
          Most likely the cloud firewall has not been updated - run
          `make apply` (Terraform opens 80/443 once a domain is configured),
          then re-run `make deploy`.
          Probe result: {{ item.status | default('no response') }}
        quiet: true
      loop: "{{ acme_probe.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Obtain a certificate for each domain
      ansible.builtin.command:
        argv: >-
          {{ ['certbot', 'certonly', '--webroot', '-w', '/var/www/letsencrypt',
              '-d', item, '--email', le_email, '--agree-tos',
              '--non-interactive', '--keep-until-expiring']
             + (['--staging'] if le_staging == '1' else []) }}
        creates: "/etc/letsencrypt/live/{{ item }}/fullchain.pem"
      loop: "{{ tls_domains }}"

    # certbot's own systemd timer handles renewal; make sure nginx picks up
    # the new certificate afterwards.
    - name: Reload nginx after renewals
      ansible.builtin.copy:
        dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
        mode: "0755"
        content: |
          #!/bin/sh
          # Managed by Ansible (nginx role).
          systemctl reload nginx

    - name: Ensure the renewal timer is enabled
      ansible.builtin.service:
        name: certbot.timer
        enabled: true
        state: started

# --- vhosts ----------------------------------------------------------------

- name: Configure the Grafana vhost
  ansible.builtin.template:
    src: grafana.conf.j2
    dest: /etc/nginx/sites-available/grafana.conf
    mode: "0644"
  notify: reload nginx

- name: Enable the Grafana vhost
  ansible.builtin.file:
    src: /etc/nginx/sites-available/grafana.conf
    dest: /etc/nginx/sites-enabled/grafana.conf
    state: link
  notify: reload nginx

- name: Configure the dashboard (Raspberry Pi) vhost
  when: dashboard_domain | length > 0
  block:
    - name: Ensure the offline-page directory exists
      ansible.builtin.file:
        path: /var/www/f10-offline
        state: directory
        mode: "0755"

    - name: Install the "car is offline" page
      ansible.builtin.template:
        src: offline.html.j2
        dest: /var/www/f10-offline/__offline.html
        mode: "0644"
      notify: reload nginx

    - name: Install the Basic Auth credentials
      community.general.htpasswd:
        path: /etc/nginx/.htpasswd-dashboard
        name: "{{ dashboard_auth_user }}"
        password: "{{ dashboard_auth_password }}"
        owner: root
        group: www-data
        mode: "0640"
      no_log: true

    - name: Configure the dashboard vhost
      ansible.builtin.template:
        src: dashboard.conf.j2
        dest: /etc/nginx/sites-available/dashboard.conf
        mode: "0644"
      notify: reload nginx

    - name: Enable the dashboard vhost
      ansible.builtin.file:
        src: /etc/nginx/sites-available/dashboard.conf
        dest: /etc/nginx/sites-enabled/dashboard.conf
        state: link
      notify: reload nginx

# --- firewall + service ----------------------------------------------------

- name: Allow HTTPS from the internet (per-vhost rules do the filtering)
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp
  when: tls_domains | length > 0

- name: Allow the plain-HTTP Grafana port for allowlisted sources
  community.general.ufw:
    rule: allow
    port: "{{ gf_public_port }}"
    proto: tcp
    src: "{{ item }}"
  loop: "{{ gf_allowed_ips }}"
  when: tls_domains | length == 0

# A vhost cannot be validated on its own (it needs the surrounding http
# context), so check the assembled config here. This fails the play before
# the handler would reload a broken config.
- name: Validate the assembled nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Enable and start nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Report how things are reachable
  ansible.builtin.debug:
    msg: >-
      {{ ('Grafana: https://' + grafana_domain) if grafana_domain
         else ('Grafana: http://<droplet>:' + gf_public_port) }}
      ({{ gf_allowed_ips | length }} allowlisted source(s));
      {{ ('Dashboard: https://' + dashboard_domain + ' -> ' + pi_wg_ip + ':' + pi_dashboard_port + ' (Basic Auth)')
         if dashboard_domain else 'Dashboard vhost: disabled' }}

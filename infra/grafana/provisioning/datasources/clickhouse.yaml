apiVersion: 1

# ClickHouse datasource, provisioned. The password comes from the CH_PASS
# environment variable passed to the Grafana container (Grafana expands
# $CH_PASS in provisioning files), so no secret is committed.
datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      # Must match CH_USER. The ClickHouse entrypoint REMOVES the built-in
      # `default` user once a custom CLICKHOUSE_USER is set, so hardcoding
      # `default` here fails authentication even with the right password.
      username: $CH_USER
      defaultDatabase: telemetry
    secureJsonData:
      password: $CH_PASS
    editable: false

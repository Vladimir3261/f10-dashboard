apiVersion: 1

# ClickHouse datasource, provisioned. The password comes from the CH_PASS
# environment variable passed to the Grafana container (Grafana expands
# $CH_PASS in provisioning files), so no secret is committed.
datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      username: default
      defaultDatabase: telemetry
    secureJsonData:
      password: $CH_PASS
    editable: false
